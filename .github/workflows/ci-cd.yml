name: Task Tracker Backend CI/CD Pipeline

# Trigger — runs on every push to main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ─── Job 1: Build and Push Docker Image ─────────────────
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Clone the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2 — Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3 — Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 4 — Build and push backend image
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/tasktracker-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/tasktracker-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 2: Summary ──────────────────────────────────────
  notify:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Success
        run: |
          echo "✅ Pipeline complete!"
          echo "Backend image: ${{ secrets.DOCKER_USERNAME }}/tasktracker-backend:latest"
          echo "Commit: ${{ github.sha }}"