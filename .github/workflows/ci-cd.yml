name: Task Tracker CI/CD Pipeline

# Trigger — runs on every push to main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ─── Job 1: Test Spring Boot ────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Clone the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2 — Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 3 — Cache Maven dependencies
      # Avoids re-downloading on every run
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Step 4 — Run tests
      - name: Run tests
        run: mvn test -B
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 3306
          DATABASE_NAME: tasktracker_test
          DATABASE_USERNAME: root
          DATABASE_PASSWORD: root

  # ─── Job 2: Build and Push Docker Images ────────────────
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: test-backend        # only runs if tests pass

    steps:
      # Step 1 — Clone the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2 — Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3 — Set up Docker Buildx
      # Enables advanced build features — multi-platform, caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 4 — Build and push backend image
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/tasktracker-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/tasktracker-backend:${{ github.sha }}
          cache-from: type=gha      # use GitHub Actions cache
          cache-to: type=gha,mode=max

      # Step 5 — Build and push frontend image
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ../tasktracker-frontend    # adjust to your React repo path
          dockerfile: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/tasktracker-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/tasktracker-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 3: Summary ─────────────────────────────────────
  notify:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Success
        run: |
          echo "✅ Pipeline complete!"
          echo "Backend image: ${{ secrets.DOCKER_USERNAME }}/tasktracker-backend:latest"
          echo "Frontend image: ${{ secrets.DOCKER_USERNAME }}/tasktracker-frontend:latest"