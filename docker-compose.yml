
services:

  # ─── MySQL Database ────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: tasktracker-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tasktracker
    ports:
      - "3307:3306"        # 3307 on host → 3306 in container
      # avoids conflict with your local MySQL
    volumes:
      - mysql-data:/var/lib/mysql    # persist data across restarts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Spring Boot Backend ───────────────────────────────────
  backend:
    build:
      context: .           # Dockerfile is in current directory
      dockerfile: Dockerfile
    container_name: tasktracker-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: mysql         # service name — Docker resolves this
      DATABASE_PORT: 3306          # internal port — not 3307
      DATABASE_NAME: tasktracker
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy  # wait for MySQL to be ready
    restart: on-failure

  # ─── React Frontend ────────────────────────────────────────
  frontend:
    build:
      context: ../learn-react/my-first-app    # path to your React project
      dockerfile: Dockerfile
    container_name: tasktracker-frontend
    environment:
      BACKEND_HOST: backend          # ← Compose service name
      BACKEND_PORT: "8080"
    ports:
      - "3000:80"          # Nginx serves on 80 inside container
    depends_on:
      - backend

volumes:
  mysql-data:              # named volume — data persists even if container deleted